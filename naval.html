<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>WaterWorld — Batalla Naval</title>
<style>
/* ═══ RESET & BASE ════════════════════════════════ */
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#000; overflow:hidden;
  width:100vw; height:100vh;
  display:flex; align-items:center; justify-content:center;
  font-family:'Courier New', Courier, monospace;
  touch-action:manipulation;
}

/* ═══ PORTADA INTERFAZ ═════════════════════════════ */
#screen-portada {
  position:fixed; inset:0; z-index:1000;
  background:radial-gradient(ellipse 100% 70% at 50% 15%, #0e2040 0%, #06101e 60%, #000 100%);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:26px; color:#fff;
}
#screen-portada::after {
  content:''; position:absolute; inset:0; pointer-events:none;
  background:repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,.12) 2px, rgba(0,0,0,.12) 4px);
}
.logo { text-align:center; }
.logo-main {
  font-size:clamp(2.8rem, 9vw, 4.6rem); font-weight:900; color:#ff00ff; letter-spacing:6px; line-height:1.0;
  text-shadow:0 0 18px #ff00ff, 0 0 50px #ff00ff55;
}
.logo-sub { margin-top:6px; font-size:.72rem; letter-spacing:5px; color:#00dbff; text-transform:uppercase; opacity:.72; }

.char-preview { display:flex; gap:20px; }
.char-card {
  display:flex; flex-direction:column; align-items:center; gap:6px; cursor:pointer; padding:12px 18px; border-radius:14px;
  border:3px solid rgba(255,255,255,.08); transition:all .25s;
}
.char-emo { font-size:3rem; line-height:1; filter:brightness(0.55); }
.char-lbl { font-size:.6rem; letter-spacing:3px; color:rgba(255,255,255,.3); }
.char-card.sel-m { border-color:#00dbff; background:rgba(0,219,255,.07); }
.char-card.sel-m .char-emo { filter:brightness(1); transform:scale(1.1); }
.char-card.sel-m .char-lbl { color:#00dbff; }
.char-card.sel-f { border-color:#ff00ff; background:rgba(255,0,255,.07); }
.char-card.sel-f .char-emo { filter:brightness(1); transform:scale(1.1); }
.char-card.sel-f .char-lbl { color:#ff00ff; }

.flabel { font-size:.58rem; letter-spacing:4px; color:#2e4055; text-transform:uppercase; margin-bottom:6px; text-align:center; }
#inp-ini {
  display:block; background:rgba(0,0,0,.8); border:2px solid #00dbff; border-radius:10px; color:#00dbff;
  font-size:2rem; padding:9px 18px; width:152px; text-align:center; outline:none; letter-spacing:14px; font-weight:bold;
  text-transform:uppercase; font-family:inherit;
}
#btn-start {
  background:linear-gradient(135deg,#ff00ff 0%,#bb00bb 100%); border:none; border-radius:50px; color:#fff;
  padding:17px 54px; font-size:1.05rem; font-weight:900; letter-spacing:4px; cursor:pointer; font-family:inherit;
  text-transform:uppercase; box-shadow:0 0 32px #ff00ff55;
}

/* ═══ CONTENEDOR VIRTUAL ESCALABLE ═══ */
#game-wrap { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:#000; }
#game-wrap.on { display:flex; }
#game-cont { position:relative; overflow:hidden; max-height:100vh; aspect-ratio: 800 / 1200; width:100%; height:100%; }
canvas { display:block; width:100%; height:100%; object-fit:contain; image-rendering:pixelated; }

/* ═══ HUD CONTROLES NAVALES ═══ */
#hud-vida-tu { position:absolute; top:25px; left:25px; z-index:20; color:#00dbff; font-size:1.3rem; font-weight:bold; text-shadow:0 0 6px #000; }
#hud-vida-boss { position:absolute; top:25px; right:25px; z-index:20; color:#ff00ff; font-size:1.3rem; font-weight:bold; text-shadow:0 0 6px #000; }

#angle-control {
  position:absolute; left:25px; top:45%; transform:translateY(-50%); z-index:25;
  background:rgba(6,16,30,0.9); border:2px solid #00dbff; border-radius:12px;
  padding:14px; display:flex; flex-direction:column; align-items:center; gap:8px; color:#fff;
}
.ang-btn { background:#00dbff; border:none; color:#000; width:38px; height:38px; font-weight:bold; font-size:1.3rem; border-radius:6px; cursor:pointer; }
#angle-disp { font-size:1.15rem; font-weight:bold; color:#00dbff; }

#control-inferior {
  position:absolute; bottom:30px; left:30px; right:30px; z-index:25;
  display:flex; align-items:center; gap:20px; background:rgba(0,0,0,0.8); padding:16px; border-radius:16px; border:1px solid rgba(255,255,255,0.1);
}
.power-container { flex-grow:1; display:flex; flex-direction:column; gap:6px; }
.power-bg { height:22px; background:#111; border:2px solid #ffcc00; border-radius:6px; overflow:hidden; }
#power-bar { height:100%; width:0%; background:linear-gradient(90deg, #ffcc00, #ff3300); }
#btn-shoot {
  background:linear-gradient(135deg,#ff0055 0%,#aa0033 100%); border:none; border-radius:10px; color:#fff;
  padding:16px 34px; font-size:1.15rem; font-weight:bold; letter-spacing:2px; cursor:pointer; font-family:inherit;
}

.ov { position:fixed; inset:0; z-index:500; background:rgba(0,0,0,.93); display:none; flex-direction:column; align-items:center; justify-content:center; gap:18px; color:#fff; text-align:center; }
.ov.on { display:flex; }
.ov-title { font-size:3rem; font-weight:900; letter-spacing:4px; }
.ov-btn { background:#ff00ff; border:none; border-radius:50px; color:#fff; padding:15px 44px; font-size:.94rem; font-weight:bold; cursor:pointer; letter-spacing:3px; }
</style>
</head>
<body>

<div id="screen-portada">
  <div class="logo">
    <div class="logo-main">WATERWORLD</div>
    <div class="logo-sub">⚓ BATALLA NAVAL SUBMARINA ⚓</div>
  </div>
  <div>
    <div class="flabel">Elige tu unidad</div>
    <div class="char-preview">
      <div class="char-card sel-m" id="cbM" onclick="selectChar('M')">
        <div class="char-emo">👨‍💼</div>
        <span class="char-lbl">HOMBRE</span>
      </div>
      <div class="char-card" id="cbF" onclick="selectChar('F')">
        <div class="char-emo">👩‍💼</div>
        <span class="char-lbl">MUJER</span>
      </div>
    </div>
  </div>
  <div>
    <div class="flabel">Tus iniciales</div>
    <input id="inp-ini" type="text" maxlength="3" placeholder="AAA" autocomplete="off" oninput="this.value=this.value.toUpperCase().replace(/[^A-Z0-9]/g,'')">
  </div>
  <button id="btn-start" onclick="empezar()">⚓ &nbsp;ZAFARRANCHO&nbsp; ⚓</button>
</div>

<div id="game-wrap">
  <div id="game-cont">
    <canvas id="canvas"></canvas>
    <div id="hud-vida-tu">TU: ❤️❤️❤️</div>
    <div id="hud-vida-boss">BOSS: ❤️❤️❤️</div>
    <div id="angle-control">
      <div style="font-size:0.6rem; letter-spacing:1px; margin-bottom:2px;">ÁNGULO</div>
      <button class="ang-btn" onclick="modificarAngulo(5)">▲</button>
      <div id="angle-disp">45°</div>
      <button class="ang-btn" onclick="modificarAngulo(-5)">▼</button>
    </div>
    <div id="control-inferior">
      <div class="power-container">
        <div style="font-size:0.65rem; color:#ffcc00; letter-spacing:2px; font-weight:bold;">POTENCIA CAÑÓN</div>
        <div class="power-bg"><div id="power-bar"></div></div>
      </div>
      <button id="btn-shoot">FUEGO</button>
    </div>
  </div>
</div>

<div class="ov" id="ov-dead"><div class="ov-title" style="color:#ff4444">💀 FLOTA HUNDIDA 💀</div><button class="ov-btn" onclick="location.reload()">🔄 &nbsp;REINTENTAR</button></div>
<div class="ov" id="ov-win"><div class="ov-title" style="color:#00ff99">🏆 VICTORIA NAVAL</div><button class="ov-btn" onclick="location.reload()">🔄 &nbsp;VOLVER</button></div>

<script>
'use strict';

const G = {
  ini: 'AAA', gen: 'M',
  running: false,
  tuVidas: 3, bossVidas: 3,
  angulo: 45, fuerza: 0, cargandoFuerza: false
};

const W = 800;
const H = 1200;
let canvas, ctx;

let tuY = 550;
let bossY = 550;
let tuDir = 1;
let bossDir = -1;

let bala = { x: 0, y: 0, vx: 0, vy: 0, activa: false, r: 16, due: 'TU' };

const assets = {
  mar: new Image(),
  nav1: new Image(),
  nav2: new Image(),
  barril: new Image()
};

assets.mar.src = 'mar.png';      
assets.nav1.src = 'nav1.png';    
assets.nav2.src = 'nav2.png';    
assets.barril.src = 'barril.png';

function selectChar(g) {
  G.gen = g;
  document.getElementById('cbM').className = 'char-card' + (g === 'M' ? ' sel-m' : '');
  document.getElementById('cbF').className = 'char-card' + (g === 'F' ? ' sel-f' : '');
}

function modificarAngulo(val) {
  G.angulo += val;
  if(G.angulo > 85) G.angulo = 85;
  if(G.angulo < 5) G.angulo = 5;
  document.getElementById('angle-disp').innerText = G.angulo + '°';
}

function empezar() {
  let val = document.getElementById('inp-ini').value.trim();
  if(val) G.ini = val.toUpperCase();
  document.getElementById('screen-portada').style.display = 'none';
  document.getElementById('game-wrap').classList.add('on');
  initGame();
}

function initGame() {
  canvas = document.getElementById('canvas');
  canvas.width = W;
  canvas.height = H;
  ctx = canvas.getContext('2d');
  
  document.getElementById('hud-vida-tu').innerText = G.ini + ': ❤️❤️❤️';
  setupDisparoBasket();
  G.running = true;
  requestAnimationFrame(loop);
}

function setupDisparoBasket() {
  let btn = document.getElementById('btn-shoot');
  const iniciarCarga = (e) => {
    e.preventDefault();
    if(!G.running || bala.activa) return;
    G.fuerza = 0;
    G.cargandoFuerza = true;
  };
  const soltarDisparo = () => {
    if(!G.cargandoFuerza) return;
    G.cargandoFuerza = false;
    let rad = G.angulo * Math.PI / 180;
    let moduloFuerza = (G.fuerza / 100) * 20 + 13;

    bala.x = 160;
    bala.y = tuY + 40;
    bala.vx = Math.cos(rad) * moduloFuerza;
    bala.vy = -Math.sin(rad) * moduloFuerza;
    bala.activa = true;
    bala.due = 'TU';
    G.fuerza = 0;
    document.getElementById('power-bar').style.width = '0%';
  };
  btn.addEventListener('mousedown', iniciarCarga);
  window.addEventListener('mouseup', soltarDisparo);
  btn.addEventListener('touchstart', iniciarCarga);
  window.addEventListener('touchend', soltarDisparo);
}

let bossAtaqueTimer = 0;
function contraataqueJefe() {
  if(bala.activa) return;
  // 🛠️ REPARACIÓN COHETE BOSS: Reducimos ángulo y bajamos fuerza para que el tiro sea tenso y dentro del lienzo
  let rad = (Math.random() * 20 + 25) * Math.PI / 180; // Ángulo parabólico bajo (25° a 45°)
  let mod = Math.random() * 3 + 14;                    // Fuerza calibrada hacia la izquierda (antes 23)
  bala.x = W - 160;
  bala.y = bossY + 40;
  bala.vx = -Math.cos(rad) * mod;
  bala.vy = -Math.sin(rad) * mod;
  bala.activa = true;
  bala.due = 'BOSS';
}

function loop(timestamp) {
  if (!G.running) return;
  update(timestamp);
  render();
  requestAnimationFrame(loop);
}

let lastTime = 0;
function update(timestamp) {
  let dt = timestamp - lastTime;
  if(!lastTime) dt = 0;
  lastTime = timestamp;

  tuY += tuDir * 1.8 * (dt / 16);
  if(tuY < 250 || tuY > 800) tuDir *= -1;

  bossY += bossDir * 2.2 * (dt / 16);
  if(bossY < 250 || bossY > 800) bossDir *= -1;

  if(G.cargandoFuerza) {
    G.fuerza += 3.2 * (dt / 16);
    if(G.fuerza > 100) G.fuerza = 100;
    document.getElementById('power-bar').style.width = G.fuerza + '%';
  }

  if(!bala.activa) {
    bossAtaqueTimer += dt;
    if(bossAtaqueTimer >= 2000) { bossAtaqueTimer = 0; contraataqueJefe(); }
  }

  if(bala.activa) {
    bala.x += bala.vx * (dt / 16);
    bala.vy += 0.38 * (dt / 16);
    bala.y += bala.vy * (dt / 16);

    if(bala.due === 'TU') {
      let dX = Math.abs(bala.x - (W - 110));
      let dY = Math.abs(bala.y - (bossY + 45));
      if(dX < 65 && dY < 55) {
        G.bossVidas--;
        document.getElementById('hud-vida-boss').innerText = 'BOSS: ' + '❤️'.repeat(G.bossVidas) + '•'.repeat(3-G.bossVidas);
        bala.activa = false;
        if(G.bossVidas <= 0) { G.running = false; document.getElementById('ov-win').classList.add('on'); }
      }
    } else if(bala.due === 'BOSS') {
      let dX = Math.abs(bala.x - 110);
      let dY = Math.abs(bala.y - (tuY + 45));
      if(dX < 65 && dY < 55) {
        G.tuVidas--;
        document.getElementById('hud-vida-tu').innerText = G.ini + ': ' + '❤️'.repeat(G.tuVidas) + '•'.repeat(3-G.tuVidas);
        bala.activa = false;
        if(G.tuVidas <= 0) { G.running = false; document.getElementById('ov-dead').classList.add('on'); }
      }
    }
    if(bala.y > H + 20 || bala.x < -20 || bala.x > W + 20) bala.activa = false;
  }
}

function render() {
  ctx.clearRect(0, 0, W, H);

  // 🛠️ REPARACIÓN FONDO AMPLIADO: Ajuste directo de mar.png sin recortes ni ampliaciones exageradas
  if(assets.mar.complete) {
    ctx.drawImage(assets.mar, 0, 0, W, H);
  }

  if(assets.nav1.complete) {
    ctx.drawImage(assets.nav1, 40, tuY, 140, 90);
  } else {
    ctx.fillStyle = '#00dbff'; ctx.fillRect(40, tuY, 120, 70);
  }

  if(assets.nav2.complete) {
    ctx.drawImage(assets.nav2, W - 180, bossY, 140, 90);
  } else {
    ctx.fillStyle = '#ff0055'; ctx.fillRect(W - 160, bossY, 120, 70);
  }

  if(bala.activa && assets.barril.complete) {
    ctx.drawImage(assets.barril, bala.x - 18, bala.y - 18, 36, 36);
  }
}
</script>
</body>
</html>
