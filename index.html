<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WaterWorld - Edición Neón</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; }
        #ui-inicio {
            position: absolute; width: 100%; height: 100%;
            background: radial-gradient(circle, #0a1422 0%, #000 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 2000; color: white;
        }
        .logo { font-size: 3rem; color: #ff00ff; text-shadow: 0 0 15px #ff00ff; margin-bottom: 20px; font-weight: bold; }
        .btn-neon {
            padding: 15px 30px; font-size: 18px; color: #0ff; border: 2px solid #0ff;
            background: transparent; cursor: pointer; text-shadow: 0 0 5px #0ff;
            box-shadow: 0 0 10px #0ff; border-radius: 10px; margin: 10px;
        }
    </style>
</head>
<body>

    <div id="ui-inicio">
        <div class="logo">WATERWORLD</div>
        <div id="botones">
            <button class="btn-neon" onclick="empezar('h')">I.D. HOMBRE</button>
            <button class="btn-neon" onclick="empezar('m')" style="color:#f0f; border-color:#f0f;">I.D. MUJER</button>
        </div>
    </div>

    <div id="game-container"></div>

<script>
let prefijo = 'h'; // 'h' para hombre, 'm' para mujer

function empezar(genero) {
    prefijo = genero;
    document.getElementById('ui-inicio').style.display = 'none';
    lanzarJuego();
}

function lanzarJuego() {
    const config = {
        type: Phaser.AUTO,
        width: 800,
        height: 1200,
        parent: 'game-container',
        scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
        physics: { default: 'arcade' },
        scene: { preload: preload, create: create, update: update }
    };
    new Phaser.Game(config);
}

function preload() {
    // Fondo (JPG según tus archivos anteriores)
    this.load.image('fondo', 'fondo.jpg');
    
    // Cargamos tus nuevos PNGs individuales
    // HOMBRE
    this.load.image('h_normal', 'personajeh.png');
    this.load.image('h_alerta', 'personajeha.png');
    this.load.image('h_muerto', 'personajehm.png');
    // MUJER
    this.load.image('m_normal', 'personajem.png');
    this.load.image('m_alerta', 'personajema.png');
    this.load.image('m_muerto', 'personajemm.png');

    this.load.on('loaderror', (file) => console.error("Falta el archivo:", file.src));
}

function create() {
    const { width, height } = this.scale;
    this.add.image(width/2, height/2, 'fondo').setDisplaySize(width, height);

    // Creamos al jugador con la imagen normal del género elegido
    this.player = this.add.sprite(width/2, height * 0.45, prefijo + '_normal');
    this.player.setScale(1.5);

    // --- ANIMACIÓN DE LATIDO ---
    this.tweens.add({
        targets: this.player,
        scaleX: 1.6,
        scaleY: 1.4,
        duration: 900,
        yoyo: true,
        repeat: -1,
        ease: 'Sine.easeInOut'
    });

    // --- LÓGICA DE MOVIMIENTO ---
    this.isSafe = false;
    this.input.on('pointerdown', () => {
        this.isSafe = !this.isSafe;
        this.tweens.add({
            targets: this.player,
            y: this.isSafe ? height * 0.85 : height * 0.45,
            duration: 600,
            ease: 'Power2'
        });
    });

    // --- CICLO ACHÍS ---
    this.time.addEvent({
        delay: 5000,
        callback: () => {
            // Cambia a imagen de ALERTA
            this.player.setTexture(prefijo + '_alerta');
            this.cameras.main.shake(500, 0.01);
            
            this.time.delayedCall(1500, () => {
                if (!this.isSafe) {
                    // MUERTE: Cambia a imagen de MUERTO
                    this.player.setTexture(prefijo + '_muerto');
                    this.cameras.main.flash(500, 255, 0, 0);
                    alert("ERROR DE SISTEMA: No llegaste al refugio.");
                    location.reload();
                } else {
                    // Vuelve a la normalidad si se salvó
                    this.player.setTexture(prefijo + '_normal');
                }
            });
        },
        loop: true
    });
}

function update() {}
</script>
</body>
</html>
