<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WaterWorld - Edición Neón</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; }
        #ui-inicio {
            position: absolute; width: 100%; height: 100%;
            background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 2000; color: #0ff; text-align: center; border: 5px solid #0ff;
        }
        .btn-neon {
            padding: 20px 40px; font-size: 24px; color: #fff; border: 3px solid #f0f;
            background: #000; cursor: pointer; box-shadow: 0 0 20px #f0f; border-radius: 15px; margin: 10px;
        }
    </style>
</head>
<body>

    <div id="ui-inicio">
        <h1 style="font-size: 50px; text-shadow: 0 0 20px #0ff;">WATERWORLD</h1>
        <p>SELECCIONA GÉNERO PARA CARGAR DATOS:</p>
        <button class="btn-neon" onclick="iniciar('h')">HOMBRE</button>
        <button class="btn-neon" onclick="iniciar('m')" style="box-shadow: 0 0 20px #0ff; border-color: #0ff;">MUJER</button>
        <p id="status" style="font-size: 12px; color: #555; margin-top: 20px;">Esperando selección...</p>
    </div>

    <div id="game-container"></div>

<script>
let config;
let prefijo = 'h';

function iniciar(g) {
    prefijo = g;
    document.getElementById('ui-inicio').style.display = 'none';
    
    config = {
        type: Phaser.AUTO,
        width: 800,
        height: 1200,
        parent: 'game-container',
        scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
        physics: { default: 'arcade' },
        scene: { preload: preload, create: create, update: update }
    };
    new Phaser.Game(config);
}

function preload() {
    // CARGA CON RUTA RELATIVA FORZADA (./)
    // Fondo
    this.load.image('fondo', './fondo.jpg');
    this.load.image('bunker', './WhatsApp Image 2026-04-16 at 09.54.47.jpeg');
    
    // Personajes
    this.load.image('h_norm', './personajeh.png');
    this.load.image('h_alert', './personajeha.png');
    this.load.image('h_dead', './personajehm.png');
    this.load.image('m_norm', './personajem.png');
    this.load.image('m_alert', './personajema.png');
    this.load.image('m_dead', './personajemm.png');

    // Video (Si el video falla, el juego seguirá funcionando)
    this.load.video('vid_explosion', './explosion.mp4');

    // Debug en consola para ver qué falla exactamente
    this.load.on('loaderror', (file) => {
        console.warn("No se pudo cargar: " + file.src);
    });
}

function create() {
    const { width, height } = this.scale;

    // 1. FONDO (Con respaldo de color si falla la imagen)
    this.add.rectangle(width/2, height/2, width, height, 0x000510); 
    if (this.textures.exists('fondo')) {
        this.add.image(width/2, height/2, 'fondo').setDisplaySize(width, height);
    }

    // 2. BÚNKER
    this.bunker = this.physics.add.staticImage(width/2, height * 0.85, 'bunker').setScale(0.7);

    // 3. JUGADOR
    let texturaInicial = prefijo === 'h' ? 'h_norm' : 'm_norm';
    this.player = this.physics.add.sprite(width/2, height * 0.4, texturaInicial);
    this.player.setScale(2);

    // Latido Neón
    this.tweens.add({
        targets: this.player,
        scale: 2.3,
        duration: 800,
        yoyo: true,
        repeat: -1
    });

    // 4. LÓGICA DE MOVIMIENTO
    this.isSafe = false;
    this.input.on('pointerdown', () => {
        this.isSafe = !this.isSafe;
        this.tweens.add({
            targets: this.player,
            y: this.isSafe ? height * 0.82 : height * 0.4,
            duration: 600,
            ease: 'Cubic.easeOut'
        });
    });

    // 5. CICLO DE ALERTA
    this.time.addEvent({
        delay: 7000,
        loop: true,
        callback: () => {
            // Cambiar a sprite de ALERTA
            this.player.setTexture(prefijo === 'h' ? 'h_alert' : 'm_alert');
            this.cameras.main.shake(500, 0.01);

            this.time.delayedCall(2000, () => {
                if (!this.isSafe) {
                    this.morir();
                } else {
                    this.player.setTexture(prefijo === 'h' ? 'h_norm' : 'm_norm');
                }
            });
        }
    });
}

function morir() {
    // Cambiar a sprite de MUERTE
    this.player.setTexture(prefijo === 'h' ? 'h_dead' : 'm_dead');
    this.cameras.main.flash(500, 255, 0, 0);

    // INTENTAR REPRODUCIR VIDEO
    try {
        let video = this.add.video(400, 600, 'vid_explosion').setScale(2);
        video.play();
        video.on('complete', () => location.reload());
    } catch (e) {
        console.error("Video falló, usando fallback");
    }

    // Si el video no funciona, recargar tras 3 segundos de todos modos
    this.time.delayedCall(3000, () => {
        alert("GAME OVER - SISTEMA DESTRUIDO");
        location.reload();
    });
}

function update() {}
</script>
</body>
</html>
