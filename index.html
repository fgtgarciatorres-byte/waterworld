<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WaterWorld - Edición Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
    </style>
</head>
<body>

<script>
class OficinaScene extends Phaser.Scene {
    constructor() { super({ key: 'OficinaScene' }); }

    preload() {
        // CARGA SIMPLE: Cargamos las imágenes como archivos únicos, sin divisiones.
        this.load.image('fondo', 'fondo.png');
        this.load.image('personaje', 'personaje.png'); // Cargamos toda la imagen
    }

    create() {
        const { width, height } = this.scale;
        this.isSafe = false;
        this.isDead = false;

        // 1. FONDO (Tu imagen espectacular)
        let bg = this.add.image(width/2, height/2, 'fondo');
        bg.setDisplaySize(width, height);

        // 2. POSICIONES (Ajustadas a tu escalera y plataformas)
        this.posOficina = height * 0.42; 
        this.posRefugio = height * 0.85;

        // 3. EL PERSONAJE (Carga Limpia)
        // Usamos un recorte manual para evitar el cuadrado negro si la imagen es muy grande
        this.player = this.add.sprite(width/2, this.posOficina, 'personaje');
        
        // Ajustamos el tamaño visual para que encaje en la oficina
        this.player.setDisplaySize(100, 100); 
        this.player.setDepth(10);

        // --- ALTERNATIVA A LA ANIMACIÓN: El "Latido" del personaje ---
        this.tweens.add({
            targets: this.player,
            scaleY: this.player.scaleY * 1.1,
            duration: 600,
            yoyo: true,
            repeat: -1,
            ease: 'Sine.easeInOut'
        });

        // 4. INTERFAZ (Estilo Neón)
        this.hpText = this.add.text(20, 20, "HP: ❤️❤️❤️", { font: 'bold 22px Arial', fill: '#00dbff' }).setDepth(100);

        // 5. CONTROL Y LÓGICA
        this.input.on('pointerdown', () => this.ejecutarMovimiento());
        this.esperarEstornudo();
    }

    ejecutarMovimiento() {
        if (this.isDead) return;
        this.isSafe = !this.isSafe;

        // Animación de "salto" entre niveles
        this.tweens.add({
            targets: this.player,
            y: this.isSafe ? this.posRefugio : this.posOficina,
            angle: this.isSafe ? 15 : -15, // Inclinación al caer/subir
            duration: 500,
            ease: 'Back.easeOut',
            onComplete: () => { 
                this.tweens.add({ targets: this.player, angle: 0, duration: 200 });
            }
        });
    }

    esperarEstornudo() {
        if (this.isDead) return;
        this.time.delayedCall(Phaser.Math.Between(3000, 6000), () => {
            // Efecto visual de susto (agitar personaje)
            this.tweens.add({ targets: this.player, x: this.player.x + 5, duration: 50, yoyo: true, repeat: 5 });
            
            let txt = this.add.text(this.scale.width/2, 200, "¡¡ACHÍS!!", { 
                font: 'bold 70px Arial', fill: '#ffff00', stroke: '#ff00ff', strokeThickness: 8 
            }).setOrigin(0.5).setDepth(50);
            
            this.time.delayedCall(1200, () => {
                txt.destroy();
                this.detonarBomba();
            });
        });
    }

    detonarBomba() {
        this.cameras.main.flash(500);
        this.cameras.main.shake(400, 0.02);

        if (!this.isSafe) {
            this.isDead = true;
            // Efecto de muerte: El personaje se vuelve negro y cae
            this.player.setTint(0x000000);
            this.tweens.add({ targets: this.player, angle: 180, y: this.scale.height + 100, duration: 1000 });
            this.time.delayedCall(2000, () => location.reload());
        } else {
            this.esperarEstornudo();
        }
    }
}

const config = {
    type: Phaser.AUTO,
    width: 800, height: 1200,
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: [OficinaScene]
};
new Phaser.Game(config);
</script>
</body>
</html>
