<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WaterWorld - Edición Final</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Courier New', monospace; }
        #ui-portal {
            position: absolute; width: 100%; height: 100%;
            background: radial-gradient(circle, #001 0%, #000 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 2000; color: #0ff; text-align: center;
        }
        .btn-neon { padding: 15px 30px; margin: 10px; font-size: 18px; color: #f0f; border: 2px solid #f0f; background: transparent; cursor: pointer; box-shadow: 0 0 15px #f0f; border-radius: 5px; font-weight: bold; width: 280px; }
    </style>
</head>
<body>

    <div id="ui-portal">
        <h1 style="font-size: 50px; text-shadow: 0 0 20px #0ff;">WATERWORLD</h1>
        <div style="margin-bottom: 20px;">
            <button onclick="setSex('h')" id="bh" style="background:#05f; color:white; padding:10px; border:none; cursor:pointer;">♂ HOMBRE</button>
            <button onclick="setSex('m')" id="bm" style="background:#333; color:white; padding:10px; border:none; cursor:pointer;">♀ MUJER</button>
        </div>
        <button class="btn-neon" onclick="startLevel('Nivel1')">PROBAR OFICINA (N1)</button>
        <button class="btn-neon" onclick="startLevel('Nivel3')" style="color:#0ff; border-color:#0ff; box-shadow: 0 0 15px #0ff;">PROBAR PLAZA (N3)</button>
    </div>

<script>
let globalData = { sex: 'h' };

function setSex(s) {
    globalData.sex = s;
    document.getElementById('bh').style.background = s === 'h' ? '#05f' : '#333';
    document.getElementById('bm').style.background = s === 'm' ? '#f0f' : '#333';
}

function startLevel(key) {
    document.getElementById('ui-portal').style.display = 'none';
    initGame(key);
}

function initGame(initialScene) {
    const config = {
        type: Phaser.AUTO,
        width: 800, height: 1200,
        parent: 'game-container',
        scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
        physics: { 
            default: 'arcade', 
            arcade: { gravity: { y: 1200 }, debug: false } 
        },
        scene: [Boot, Nivel1, Nivel3]
    };
    new Phaser.Game(config);
}

class Boot extends Phaser.Scene {
    constructor() { super('Boot'); }
    preload() {
        // --- CARGA DE ASSETS (Nombres exactos de tu GitHub) ---
        this.load.image('f_oficina', 'fondo.png');
        this.load.image('f_plaza', 'plaza.png');
        this.load.image('bunker', 'WhatsApp Image 2026-04-16 at 09.54.47.jpeg');
        
        this.load.image('boss', 'boss.png');
        this.load.image('silla', 'silla.png');
        this.load.image('cafe', 'cafe.png');
        this.load.image('barril', 'barrilexp.png');

        // Secuencia explosión
        for(let i=1; i<=5; i++) { this.load.image(`e${i}`, `e${i}.png`); }

        // Personajes
        const s = globalData.sex;
        this.load.image('p_n', `personaje${s}.png`);
        this.load.image('p_a', `personaje${s}a.png`);
        this.load.image('p_m', `personaje${s}m.png`);

        // Detector de errores
        this.load.on('loaderror', (file) => {
            console.error("Fallo al cargar: " + file.src + " | Revisa si el nombre tiene mayúsculas en GitHub.");
        });
    }
    create() {
        // Crear animación global una sola vez
        this.anims.create({
            key: 'boom',
            frames: [ {key:'e1'}, {key:'e2'}, {key:'e3'}, {key:'e4'}, {key:'e5'} ],
            frameRate: 12, repeat: 0
        });
    }
}

class Nivel1 extends Phaser.Scene {
    constructor() { super('Nivel1'); }
    create() {
        const { width, height } = this.scale;
        this.add.image(width/2, height/2, 'f_oficina').setDisplaySize(width, height);
        this.add.image(width/2, 1100, 'bunker').setScale(0.8).setAlpha(0.6);

        this.player = this.add.container(width/2, 400);
        this.sprite = this.add.sprite(0, 0, 'p_n').setScale(0.8);
        this.player.add(this.sprite);

        // UI
        this.vidas = 3;
        this.vText = this.add.text(30, 40, '❤️❤️❤️', { fontSize: '40px' });

        this.input.on('pointerdown', () => {
            let targetY = (this.player.y < 600) ? 1080 : 400;
            this.tweens.add({ targets: this.player, y: targetY, duration: 500 });
        });

        this.time.addEvent({
            delay: 6000, loop: true,
            callback: () => {
                this.sprite.setTexture('p_a');
                this.time.delayedCall(2000, () => {
                    if(this.player.y < 600) this.muerte();
                    else this.sprite.setTexture('p_n');
                });
            }
        });
    }

    muerte() {
        this.sprite.setTexture('p_m');
        let exp = this.add.sprite(this.player.x, this.player.y, 'e1').setScale(4).setDepth(100);
        exp.play('boom');
        this.time.delayedCall(2000, () => location.reload());
    }
}

class Nivel3 extends Phaser.Scene {
    constructor() { super('Nivel3'); }
    create() {
        const { width, height } = this.scale;
        
        // 1. Fondo ajustado
        this.add.image(width/2, height/2, 'f_plaza').setDisplaySize(width, height);
        
        // 2. Boss en el balcón (Izquierda, según tu plaza.png)
        this.boss = this.add.image(120, 200, 'boss').setScale(0.25);

        // 3. Jugador en el suelo de la calle
        this.player = this.physics.add.sprite(width/2, 1100, 'p_n').setScale(0.8);
        this.player.body.setAllowGravity(false);
        this.player.setCollideWorldBounds(true);

        this.items = this.physics.add.group();
        this.sillas = 0;
        this.txt = this.add.text(400, 80, 'PEDIDO: 🪑 0/5', { fontSize: '40px', fill: '#f00', fontStyle: 'bold' }).setOrigin(0.5);

        // 4. Lanzamientos del Boss
        this.time.addEvent({
            delay: 1800, loop: true,
            callback: () => {
                let t = Phaser.Math.RND.pick(['silla', 'cafe', 'barril']);
                let obj = this.items.create(120, 200, t);
                
                // --- ESCALADO INDIVIDUAL ---
                if (t === 'barril') obj.setScale(0.7); // El barril es pequeño, no lo reducimos tanto
                else obj.setScale(0.12); // Silla y Café son IA, los reducimos mucho

                obj.setVelocity(Phaser.Math.Between(250, 600), -850);
                obj.setAngularVelocity(Phaser.Math.Between(-200, 200));
            }
        });

        this.physics.add.overlap(this.player, this.items, (p, i) => {
            if(i.texture.key === 'barril') location.reload();
            else {
                this.sillas++;
                this.txt.setText(`PEDIDO: 🪑 ${this.sillas}/5`);
                i.destroy();
                if(this.sillas >= 5) { alert("¡NIVEL 3 GANADO!"); location.reload(); }
            }
        });

        this.input.on('pointermove', (p) => { this.player.x = p.x; });
    }
}
</script>
</body>
</html>
