<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>WaterWorld - Calibración Zonas</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Courier New', monospace; }
        #ui-inicio {
            position: absolute; width: 100%; height: 100%;
            background: #001; display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 2000; color: #0ff; text-align: center;
        }
        .btn { padding: 15px 30px; margin: 10px; cursor: pointer; background: transparent; border: 2px solid #f0f; color: #f0f; box-shadow: 0 0 10px #f0f; font-weight: bold; }
    </style>
</head>
<body>

    <div id="ui-inicio">
        <h1 style="font-size: 45px; text-shadow: 0 0 15px #0ff;">WATERWORLD</h1>
        <div style="margin: 20px;">
            <button class="btn" onclick="comenzar('h')">♂ HOMBRE</button>
            <button class="btn" onclick="comenzar('m')" style="border-color:#0ff; color:#0ff; box-shadow: 0 0 10px #0ff;">♀ MUJER</button>
        </div>
    </div>

<script>
let genero = 'h';

function comenzar(g) {
    genero = g;
    document.getElementById('ui-inicio').style.display = 'none';
    
    const config = {
        type: Phaser.AUTO,
        width: 800,
        height: 1200,
        parent: 'game-container',
        scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
        physics: { default: 'arcade' },
        scene: { preload: preload, create: create, update: update }
    };
    new Phaser.Game(config);
}

function preload() {
    this.load.image('fondo', 'fondo.png');
    this.load.image('bunker', 'WhatsApp Image 2026-04-16 at 09.54.47.jpeg');
    this.load.image('h_n', 'personajeh.png');  this.load.image('h_a', 'personajeha.png');  this.load.image('h_m', 'personajehm.png');
    this.load.image('m_n', 'personajem.png');  this.load.image('m_a', 'personajema.png');  this.load.image('m_m', 'personajemm.png');
    this.load.video('v_exp', 'explosion.mp4');
}

function create() {
    const { width, height } = this.scale;

    // 1. ESCENARIO
    this.add.image(width/2, height/2, 'fondo').setDisplaySize(width, height).setDepth(-1);
    this.bunker = this.add.image(width/2, height * 0.85, 'bunker').setScale(0.6).setAlpha(0.6);

    // 2. PERSONAJE (Contenedor para latido y nombre)
    this.pContainer = this.add.container(width/2, height * 0.3); // Inicia arriba (Zona Peligro)
    let textKey = genero === 'h' ? 'h_n' : 'm_n';
    this.sprite = this.add.sprite(0, 0, textKey).setScale(0.7);
    this.pContainer.add(this.sprite);

    // Latido constante
    this.tweens.add({ targets: this.pContainer, scale: 1.1, duration: 800, yoyo: true, repeat: -1 });

    // 3. UI: VIDAS Y RELOJ (ROJO)
    this.vidas = 3;
    this.corazones = this.add.text(30, 40, '❤️❤️❤️', { fontSize: '45px' });
    
    this.horas = 8; this.minutos = 0;
    this.relojTexto = this.add.text(width - 250, 40, '08:00 AM', { 
        fontSize: '45px', 
        fill: '#ff0000', // RELOJ ROJO
        fontStyle: 'bold',
        stroke: '#000',
        strokeThickness: 6
    });

    // Reloj acelerado: Cada 1 seg real pasan 30 min de juego
    this.time.addEvent({
        delay: 1000,
        callback: () => {
            this.minutos += 30;
            if(this.minutos >= 60) { this.minutos = 0; this.horas++; }
            let h = this.horas < 10 ? '0'+this.horas : this.horas;
            let m = this.minutos === 0 ? '00' : this.minutos;
            this.relojTexto.setText(`${h}:${m} AM`);
        },
        loop: true
    });

    // 4. MOVIMIENTO (Click para alternar entre arriba y abajo)
    this.input.on('pointerdown', () => {
        if(this.vidas <= 0) return;
        let destinoY = (this.pContainer.y < 600) ? height * 0.82 : height * 0.3;
        this.tweens.add({ targets: this.pContainer, y: destinoY, duration: 500, ease: 'Power2' });
    });

    // 5. SECUENCIA ACHÍS Y DETECCIÓN DE ZONA
    this.time.addEvent({
        delay: 6000,
        loop: true,
        callback: () => {
            if(this.vidas <= 0) return;
            
            // Fase 1: Susto
            this.sprite.setTexture(genero === 'h' ? 'h_a' : 'm_a');
            this.cameras.main.shake(400, 0.01);
            
            // Fase 2: Comprobar posición tras 2 segundos
            this.time.delayedCall(2000, () => {
                // LÓGICA DE ZONA: Si Y es menor a 600 está en la mitad superior (MUERE)
                if (this.pContainer.y < 600) {
                    this.quitarVida();
                } else {
                    // Está en la mitad inferior (SALVADO)
                    this.sprite.setTexture(genero === 'h' ? 'h_n' : 'm_n');
                }
            });
        }
    });
}

function quitarVida() {
    this.vidas--;
    let hearts = '';
    for(let i=0; i<this.vidas; i++) hearts += '❤️';
    this.corazones.setText(hearts);

    if (this.vidas <= 0) {
        this.morirDefinitivamente();
    } else {
        // Daño temporal
        this.cameras.main.flash(500, 255, 0, 0);
        this.sprite.setTexture(genero === 'h' ? 'h_n' : 'm_n');
    }
}

function morirDefinitivamente() {
    // 1. Cambiar a sprite de MUERTO
    this.sprite.setTexture(genero === 'h' ? 'h_m' : 'm_m');
    this.cameras.main.shake(800, 0.05);

    // 2. Activar VIDEO de Explosión
    let video = this.add.video(this.pContainer.x, this.pContainer.y, 'v_exp');
    video.setDepth(100).setScale(2).play();

    this.time.delayedCall(3000, () => {
        alert("TERMINAL DESTRUIDA - I.D. PERDIDO");
        location.reload();
    });
}

function update() {}
</script>
</body>
</html>
