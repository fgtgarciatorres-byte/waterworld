<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>WaterWorld - Plaza del Neón</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Courier New', monospace; }
        #ui-portada {
            position: absolute; width: 100%; height: 100%;
            background: radial-gradient(circle, #001 0%, #000 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 2000; color: #0ff; text-align: center;
        }
        .btn-nivel { padding: 15px 30px; margin: 10px; font-size: 18px; color: #f0f; border: 2px solid #f0f; background: transparent; cursor: pointer; box-shadow: 0 0 15px #f0f; border-radius: 5px; font-weight: bold; width: 280px; }
    </style>
</head>
<body>

    <div id="ui-portada">
        <h1 style="font-size: 50px; text-shadow: 0 0 20px #0ff;">WATERWORLD</h1>
        <p>CONTROL DE NIVELES - MODO DESARROLLADOR</p>
        <button class="btn-nivel" onclick="lanzar('Nivel1')">PROBAR OFICINA (N1)</button>
        <button class="btn-nivel" onclick="lanzar('Nivel3')" style="color:#0ff; border-color:#0ff; box-shadow: 0 0 15px #0ff;">PROBAR PLAZA (N3)</button>
    </div>

    <div id="game-container"></div>

<script>
let configGlobal = { genero: 'h', nombre: 'OPERADOR' };

function lanzar(escena) {
    document.getElementById('ui-portada').style.display = 'none';
    iniciarJuego(escena);
}

function iniciarJuego(escenaInicial) {
    const config = {
        type: Phaser.AUTO,
        width: 800, height: 1200,
        parent: 'game-container',
        scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
        physics: { 
            default: 'arcade', 
            arcade: { gravity: { y: 1000 }, debug: false } 
        },
        scene: [Boot, Nivel1, Nivel3]
    };
    const game = new Phaser.Game(config);
    game.events.once('ready', () => { game.scene.start(escenaInicial); });
}

class Boot extends Phaser.Scene {
    constructor() { super('Boot'); }
    preload() {
        // Fondos
        this.load.image('f_oficina', 'fondo.png');
        this.load.image('f_plaza', 'plaza.png');
        this.load.image('bunker', 'WhatsApp Image 2026-04-16 at 09.54.47.jpeg');
        
        // Nivel 3 Assets
        this.load.image('boss', 'boss.png');
        this.load.image('silla', 'silla.png');
        this.load.image('cafe', 'cafe.png');
        this.load.image('barril', 'barril.png');
        this.load.image('humo', 'e1.png'); // Usamos e1 como partícula

        // Explosión Secuencial
        for(let i=1; i<=5; i++) { this.load.image(`e${i}`, `e${i}.png`); }

        // Personajes
        this.load.image('h_n', 'personajeh.png'); this.load.image('h_a', 'personajeha.png'); this.load.image('h_m', 'personajehm.png');
        this.load.image('m_n', 'personajem.png'); this.load.image('m_a', 'personajema.png'); this.load.image('m_m', 'personajemm.png');
    }
}

class Nivel1 extends Phaser.Scene {
    constructor() { super('Nivel1'); }
    create() {
        // (Lógica del nivel 1 mantenida y simplificada para no estorbar)
        this.add.image(400, 600, 'f_oficina').setDisplaySize(800, 1200);
        this.add.text(400, 100, "NIVEL 1 - OFICINA", {fontSize: '32px', fill: '#0ff'}).setOrigin(0.5);
    }
}

class Nivel3 extends Phaser.Scene {
    constructor() { super('Nivel3'); }
    create() {
        const { width, height } = this.scale;

        // 1. ANIMACIÓN DE EXPLOSIÓN
        if (!this.anims.exists('boom')) {
            this.anims.create({
                key: 'boom',
                frames: [ {key:'e1'}, {key:'e2'}, {key:'e3'}, {key:'e4'}, {key:'e5'} ],
                frameRate: 12, repeat: 0
            });
        }

        // 2. FONDO PLAZA
        this.add.image(width/2, height/2, 'f_plaza').setDisplaySize(width, height);

        // 3. BOSS EN EL BALCÓN (Coordenadas ajustadas al balcón izquierdo)
        this.boss = this.add.image(180, 380, 'boss').setScale(0.25);

        // 4. JUGADOR (En el suelo de la plaza)
        let k = configGlobal.genero === 'h' ? 'h_n' : 'm_n';
        this.player = this.physics.add.sprite(width/2, 1080, k).setScale(0.7);
        this.player.body.setAllowGravity(false); // El jugador no cae
        this.player.setCollideWorldBounds(true);

        // 5. GRUPO DE PROYECTILES
        this.proyectiles = this.physics.add.group();

        // 6. UI DE PEDIDO
        this.cuentaSillas = 0; this.cuentaCafes = 0;
        this.txtOrden = this.add.text(400, 80, 'PEDIDO: 🪑 0/5 | ☕ 0/3', { 
            fontSize: '32px', fill: '#f00', fontStyle: 'bold', backgroundColor: '#000000aa' 
        }).setOrigin(0.5);

        // 7. LANZAMIENTO (Cada 1.8 segundos)
        this.time.addEvent({
            delay: 1800, loop: true,
            callback: () => {
                let tipos = ['silla', 'cafe', 'barril'];
                let t = Phaser.Math.RND.pick(tipos);
                
                // Salen desde la mano del Boss en el balcón
                let obj = this.proyectiles.create(180, 380, t);
                obj.setScale(0.15); // ¡ESCALA PEQUEÑA PARA QUE NO SEA GIGANTE!
                obj.setVelocity(Phaser.Math.Between(300, 650), -800);
                obj.setAngularVelocity(Phaser.Math.Between(-200, 200));
            }
        });

        // 8. COLISIONES
        this.physics.add.overlap(this.player, this.proyectiles, (p, item) => {
            let t = item.texture.key;
            if(t === 'barril') {
                this.ejecutarMuerte();
            } else {
                if(t === 'silla') this.cuentaSillas++;
                if(t === 'cafe') this.cuentaCafes++;
                this.txtOrden.setText(`PEDIDO: 🪑 ${this.cuentaSillas}/5 | ☕ ${this.cuentaCafes}/3`);
                this.cameras.main.flash(100, 0, 255, 255);
            }
            item.destroy();
            
            if(this.cuentaSillas >= 5 && this.cuentaCafes >= 3) {
                this.add.text(400, 600, '¡PEDIDO LISTO!', { fontSize: '60px', fill: '#0ff' }).setOrigin(0.5);
                this.time.delayedCall(2000, () => location.reload());
            }
        });

        // CONTROL: El jugador sigue al dedo/ratón
        this.input.on('pointermove', (p) => { this.player.x = p.x; });
    }

    ejecutarMuerte() {
        let k_muerto = configGlobal.genero === 'h' ? 'h_m' : 'm_m';
        this.player.setTexture(k_muerto);
        
        let boom = this.add.sprite(this.player.x, this.player.y, 'e1').setScale(3);
        boom.play('boom');
        
        this.cameras.main.shake(500, 0.05);
        this.time.delayedCall(2000, () => location.reload());
    }

    update() {
        // Limpiar objetos que caen al suelo
        this.proyectiles.getChildren().forEach(o => { if(o.y > 1150) o.destroy(); });
    }
}
</script>
</body>
</html>
