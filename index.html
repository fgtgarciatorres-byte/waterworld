<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WaterWorld - Neón Submarino</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Courier New', Courier, monospace; }
        #ui-inicio {
            position: absolute; width: 100%; height: 100%;
            background: radial-gradient(circle, #0a1422 0%, #000 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 2000; color: white; text-align: center;
        }
        .btn-neon {
            padding: 15px 30px; margin: 10px; font-size: 20px; color: #0ff; border: 2px solid #0ff;
            background: transparent; cursor: pointer; text-shadow: 0 0 10px #0ff;
            box-shadow: 0 0 15px #0ff; border-radius: 10px; transition: 0.3s;
        }
        .btn-neon:hover { background: #0ff; color: #000; }
    </style>
</head>
<body>

    <div id="ui-inicio">
        <h1 style="color: #ff00ff; text-shadow: 0 0 20px #ff00ff; font-size: 50px;">WATERWORLD</h1>
        <p>CONECTANDO I.D. SUBMARINA...</p>
        <div>
            <button class="btn-neon" onclick="empezar('h')">HOMBRE</button>
            <button class="btn-neon" onclick="empezar('m')" style="color:#f0f; border-color:#f0f; box-shadow: 0 0 15px #f0f;">MUJER</button>
        </div>
    </div>

    <div id="game-container"></div>

<script>
let generoSel = 'h';

function empezar(g) {
    generoSel = g;
    document.getElementById('ui-inicio').style.display = 'none';
    lanzarJuego();
}

function lanzarJuego() {
    const config = {
        type: Phaser.AUTO,
        width: 800,
        height: 1200,
        parent: 'game-container',
        scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
        physics: { default: 'arcade' },
        scene: { preload: preload, create: create, update: update }
    };
    new Phaser.Game(config);
}

function preload() {
    // Assets de Fondo y Búnker
    this.load.image('fondo', 'fondo.jpg');
    this.load.image('bunker', 'WhatsApp Image 2026-04-16 at 09.54.47.jpeg');
    
    // Personajes Individuales (Tus nuevos PNGs)
    this.load.image('h_norm', 'personajeh.png');
    this.load.image('h_alert', 'personajeha.png');
    this.load.image('h_dead', 'personajehm.png');
    this.load.image('m_norm', 'personajem.png');
    this.load.image('m_alert', 'personajema.png');
    this.load.image('m_dead', 'personajemm.png');

    // VIDEO DE EXPLOSIÓN
    this.load.video('vid_explosion', 'explosion.mp4');
}

function create() {
    const { width, height } = this.scale;
    this.add.image(width/2, height/2, 'fondo').setDisplaySize(width, height);
    
    this.bunker = this.physics.add.staticImage(width/2, height * 0.85, 'bunker').setScale(0.6);
    
    // Configuración inicial del personaje
    let keyBase = generoSel === 'h' ? 'h_norm' : 'm_norm';
    this.player = this.physics.add.sprite(width/2, height * 0.4, keyBase).setScale(1.8);
    this.player.setCollideWorldBounds(true);

    // Animación de "Latido" neón
    this.tweens.add({
        targets: this.player,
        scaleX: 2.0,
        scaleY: 1.6,
        duration: 1000,
        yoyo: true,
        repeat: -1,
        ease: 'Sine.easeInOut'
    });

    // Control de movimiento (Click/Tap)
    this.isSafe = false;
    this.input.on('pointerdown', () => {
        this.isSafe = !this.isSafe;
        this.tweens.add({
            targets: this.player,
            y: this.isSafe ? height * 0.82 : height * 0.4,
            duration: 500,
            ease: 'Power2'
        });
    });

    // SISTEMA DE ALERTA Y EXPLOSIÓN
    this.time.addEvent({
        delay: 6000,
        loop: true,
        callback: () => {
            // Cambio a estado ALERTA
            this.player.setTexture(generoSel === 'h' ? 'h_alert' : 'm_alert');
            this.cameras.main.shake(500, 0.01);
            
            this.time.delayedCall(2000, () => {
                if (!this.isSafe) {
                    this.ejecutarMuerte();
                } else {
                    this.player.setTexture(generoSel === 'h' ? 'h_norm' : 'm_norm');
                }
            });
        }
    });
}

function ejecutarMuerte() {
    // 1. Cambiar imagen a MUERTO
    this.player.setTexture(generoSel === 'h' ? 'h_dead' : 'm_dead');
    
    // 2. Reproducir VIDEO de explosión encima
    let vid = this.add.video(this.player.x, this.player.y, 'vid_explosion').setScale(2);
    vid.play();
    
    this.cameras.main.flash(500, 255, 0, 0);
    
    this.time.delayedCall(2000, () => {
        alert("SISTEMA DESTRUIDO");
        location.reload();
    });
}

function update() {}
</script>
</body>
</html>
