<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WaterWorld - Nivel 1 Fix</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
    </style>
</head>
<body>

<script>
class OficinaScene extends Phaser.Scene {
    constructor() { super({ key: 'OficinaScene' }); }

    preload() {
        this.load.image('fondo', 'fondo.png');
        
        // AJUSTE CRÍTICO: Si el cuadrado se ve mal, es que estos números (128) 
        // deben coincidir con el tamaño real de un muñequito en tu imagen.
        this.load.spritesheet('jugador', 'personaje.png', { 
            frameWidth: 128, 
            frameHeight: 128 
        });
    }

    create() {
        const { width, height } = this.scale;
        this.isSafe = false;
        this.isDead = false;

        // 1. FONDO (Ajustado a tu nueva imagen neón)
        let bg = this.add.image(width/2, height/2, 'fondo');
        bg.setDisplaySize(width, height);

        // 2. POSICIONES SEGÚN TU DIBUJO
        // En tu fondo, la oficina está arriba y el refugio está al final de la escalera.
        this.posOficina = height * 0.35; 
        this.posRefugio = height * 0.82;

        // 3. ANIMACIONES
        // Usamos los frames de la hoja de sprites que generamos
        if (this.textures.exists('jugador')) {
            this.anims.create({
                key: 'camina',
                frames: this.anims.generateFrameNumbers('jugador', { start: 0, end: 3 }),
                frameRate: 8,
                repeat: -1
            });
            this.anims.create({
                key: 'muerto',
                frames: [{ key: 'jugador', frame: 12 }],
                frameRate: 1
            });
        }

        // 4. EL PERSONAJE (Sprite con profundidad)
        this.player = this.add.sprite(width/2, this.posOficina, 'jugador');
        this.player.setScale(1.5); // Ajusta este número si se ve muy grande o pequeño
        this.player.setDepth(10);
        
        if (this.textures.exists('jugador')) {
            this.player.play('camina');
        }

        // 5. INTERFAZ
        this.hpText = this.add.text(20, 20, "HP: ❤️❤️❤️", { font: 'bold 24px Arial', fill: '#00dbff' }).setDepth(100);

        // 6. MECÁNICA
        this.input.on('pointerdown', () => this.mover());
        this.startSneeze();
    }

    mover() {
        if (this.isDead) return;
        this.isSafe = !this.isSafe;
        
        // Movimiento suave entre los dos pisos del fondo
        this.tweens.add({
            targets: this.player,
            y: this.isSafe ? this.posRefugio : this.posOficina,
            duration: 500,
            ease: 'Cubic.easeInOut'
        });
    }

    startSneeze() {
        if (this.isDead) return;
        this.time.delayedCall(Phaser.Math.Between(3000, 6000), () => {
            let aviso = this.add.text(this.scale.width/2, 200, "¡¡ACHÍS!! 🤧", { 
                font: 'bold 60px Arial', fill: '#ffff00', stroke: '#000', strokeThickness: 8 
            }).setOrigin(0.5).setDepth(20);
            
            this.time.delayedCall(1200, () => {
                aviso.destroy();
                this.detonar();
            });
        });
    }

    detonar() {
        this.cameras.main.flash(500);
        this.cameras.main.shake(400, 0.02);

        if (!this.isSafe) {
            this.isDead = true;
            this.player.play('muerto');
            this.time.delayedCall(2000, () => location.reload());
        } else {
            this.startSneeze();
        }
    }
}

const config = {
    type: Phaser.AUTO,
    width: 800,
    height: 1200, // Proporción vertical para tu fondo
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: [OficinaScene]
};
new Phaser.Game(config);
</script>
</body>
</html>
