<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>WaterWorld - Secuencia Operativa</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
        #ui-inicio {
            position: absolute; width: 100%; height: 100%;
            background: #001; display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 2000; color: #0ff; font-family: monospace;
        }
        .btn { padding: 15px 30px; margin: 10px; cursor: pointer; background: transparent; border: 2px solid #f0f; color: #f0f; box-shadow: 0 0 10px #f0f; }
    </style>
</head>
<body>

    <div id="ui-inicio">
        <h1>WATERWORLD I.D.</h1>
        <button class="btn" onclick="comenzar('h')">♂ HOMBRE</button>
        <button class="btn" onclick="comenzar('m')" style="border-color:#0ff; color:#0ff; box-shadow: 0 0 10px #0ff;">♀ MUJER</button>
    </div>

<script>
let genero = 'h';

function comenzar(g) {
    genero = g;
    document.getElementById('ui-inicio').style.display = 'none';
    
    const config = {
        type: Phaser.AUTO,
        width: 800,
        height: 1200,
        parent: 'game-container',
        scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
        physics: { default: 'arcade' },
        scene: { preload: preload, create: create, update: update }
    };
    new Phaser.Game(config);
}

function preload() {
    // 1. FONDO (Lo cargamos como PNG)
    this.load.image('fondo', 'fondo.png');
    this.load.image('bunker', 'WhatsApp Image 2026-04-16 at 09.54.47.jpeg');
    
    // 2. PERSONAJES (Extensiones confirmadas)
    this.load.image('h_n', 'personajeh.png');  // Normal
    this.load.image('h_a', 'personajeha.png'); // Asustado
    this.load.image('h_m', 'personajehm.png'); // Muerto
    
    this.load.image('m_n', 'personajem.png');  // Normal
    this.load.image('m_a', 'personajema.png'); // Asustado
    this.load.image('m_m', 'personajemm.png'); // Muerto

    // 3. EXPLOSIÓN
    this.load.video('vid_exp', 'explosion.mp4');
}

function create() {
    const { width, height } = this.scale;

    // FONDO: Le ponemos profundidad -1 para que siempre esté atrás
    if (this.textures.exists('fondo')) {
        this.add.image(width/2, height/2, 'fondo').setDisplaySize(width, height).setDepth(-1);
    }

    // BÚNKER
    this.bunker = this.physics.add.staticImage(width/2, height * 0.85, 'bunker').setScale(0.7);

    // JUGADOR (Inicia Normal)
    let key = genero === 'h' ? 'h_n' : 'm_n';
    this.player = this.physics.add.sprite(width/2, height * 0.4, key).setScale(2);

    // Latido
    this.tweens.add({ targets: this.player, scale: 2.2, duration: 800, yoyo: true, repeat: -1 });

    // Movimiento
    this.isSafe = false;
    this.input.on('pointerdown', () => {
        this.isSafe = !this.isSafe;
        this.tweens.add({
            targets: this.player,
            y: this.isSafe ? height * 0.82 : height * 0.4,
            duration: 500
        });
    });

    // CICLO DE JUEGO (Secuencia Achís)
    this.time.addEvent({
        delay: 6000,
        loop: true,
        callback: () => {
            // 1. ESTORNUDO -> Cambia a ASUSTADO
            this.player.setTexture(genero === 'h' ? 'h_a' : 'm_a');
            this.cameras.main.shake(300, 0.01);
            
            // 2. Tiempo de reacción (2 segundos)
            this.time.delayedCall(2000, () => {
                if (!this.isSafe) {
                    // RESULTADO: MUERTE
                    this.morir();
                } else {
                    // RESULTADO: SALVADO (Vuelve a Normal)
                    this.player.setTexture(genero === 'h' ? 'h_n' : 'm_n');
                }
            });
        }
    });
}

function morir() {
    // 1. Cambia a MUERTO
    this.player.setTexture(genero === 'h' ? 'h_m' : 'm_m');
    this.cameras.main.flash(500, 255, 0, 0);

    // 2. VIDEO EXPLOSIÓN (Si no carga, saldrá el texto de error)
    try {
        let video = this.add.video(400, 600, 'vid_exp').setScale(2).setDepth(100);
        video.play();
        // Si el video falla al reproducir, forzamos el reinicio tras 2 segundos
        this.time.delayedCall(2000, () => location.reload());
    } catch(e) {
        alert("¡BOOM! EXPLOSIÓN");
        location.reload();
    }
}

function update() {}
</script>
</body>
</html>
