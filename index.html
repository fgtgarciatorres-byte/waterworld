<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WaterWorld - Nivel 1</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
    </style>
</head>
<body>

<script>
class OficinaScene extends Phaser.Scene {
    constructor() { super({ key: 'OficinaScene' }); }

    preload() {
        // Cargamos tu personaje desde GitHub
        this.load.spritesheet('jugador', 'personaje.png', { frameWidth: 64, frameHeight: 64 });
        // Intentamos cargar fondo si existe
        this.load.image('fondo', 'fondo.png');
    }

    create() {
        const { width, height } = this.scale;
        this.isSafe = false;
        this.isDead = false;

        // --- 1. FONDO (Prioridad Gráfica) ---
        if (this.textures.exists('fondo')) {
            this.add.image(width/2, height/2, 'fondo').setDisplaySize(width, height);
        } else {
            // Fondo neón de emergencia (para que no se vea "fatal")
            this.add.rectangle(0, 0, width, height/2, 0x1a2533).setOrigin(0);
            this.add.rectangle(0, height/2, width, height/2, 0x0a0a0a).setOrigin(0);
            this.add.grid(width/2, height*0.75, width, height/2, 40, 40, 0x000, 0, 0x00dbff, 0.1);
        }

        // --- 2. DECORACIÓN (Basada en tu boceto) ---
        this.drawDesks(width, height);

        // --- 3. ANIMACIONES ---
        if (this.textures.exists('jugador')) {
            this.anims.create({
                key: 'caminar',
                frames: this.anims.generateFrameNumbers('jugador', { start: 0, end: 3 }),
                frameRate: 8, repeat: -1
            });
            this.anims.create({
                key: 'asustado', frames: [{ key: 'jugador', frame: 8 }]
            });
            this.anims.create({
                key: 'muerto', frames: [{ key: 'jugador', frame: 12 }]
            });
        }

        // --- 4. PERSONAJE ---
        this.player = this.add.sprite(width/2, height/4, 'jugador').setScale(2.5).setDepth(10);
        if (this.textures.exists('jugador')) this.player.play('caminar');

        // --- 5. UI Y EFECTOS ---
        this.hpText = this.add.text(20, 20, "HP: ❤️❤️❤️", { font: 'bold 20px Arial', fill: '#00dbff' }).setDepth(100);
        this.flash = this.add.rectangle(0,0, width, height, 0xffffff).setOrigin(0).setAlpha(0).setDepth(1000);

        // Controles
        this.input.on('pointerdown', () => this.toggleShelter());
        this.startSneezeTimer();
    }

    drawDesks(w, h) {
        for(let i=0; i<3; i++) {
            let dx = (w/4) * (i+1);
            // Dibujamos las mesas del boceto
            this.add.rectangle(dx, h/3.2, 120, 10, 0x34495e).setOrigin(0.5).setStrokeStyle(2, 0x00dbff);
            this.add.rectangle(dx, h/3.2 - 25, 40, 30, 0x222).setOrigin(0.5).setStrokeStyle(1, 0x00dbff);
        }
    }

    toggleShelter() {
        if (this.isDead) return;
        this.isSafe = !this.isSafe;
        let targetY = this.isSafe ? (this.scale.height * 0.8) : (this.scale.height * 0.25);
        this.tweens.add({ targets: this.player, y: targetY, duration: 300, ease: 'Back.easeOut' });
    }

    startSneezeTimer() {
        if (this.isDead) return;
        this.time.delayedCall(Phaser.Math.Between(3000, 5000), () => {
            if(this.textures.exists('jugador')) this.player.play('asustado');
            let t = this.add.text(this.scale.width/2, 150, "¡¡ACHÍS!! 🤧", { 
                font: 'bold 60px Arial', fill: '#ff0', stroke: '#000', strokeThickness: 8 
            }).setOrigin(0.5);
            
            this.time.delayedCall(1200, () => { t.destroy(); this.detonate(); });
        });
    }

    detonate() {
        this.flash.setAlpha(1);
        this.tweens.add({ targets: this.flash, alpha: 0, duration: 600 });
        this.cameras.main.shake(400, 0.02);

        if (!this.isSafe) {
            this.isDead = true;
            if(this.textures.exists('jugador')) this.player.play('muerto');
            this.time.delayedCall(2000, () => location.reload());
        } else {
            if(this.textures.exists('jugador')) this.player.play('caminar');
            this.startSneezeTimer();
        }
    }
}

const config = {
    type: Phaser.AUTO,
    width: 800, height: 1200,
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: [OficinaScene]
};
new Phaser.Game(config);
</script>
</body>
</html>
