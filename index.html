<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WaterWorld - Fix Personaje</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
    </style>
</head>
<body>

<script>
class OficinaScene extends Phaser.Scene {
    constructor() { super({ key: 'OficinaScene' }); }

    preload() {
        this.load.image('fondo', 'fondo.png');
        
        // --- AJUSTE MAESTRO ---
        // Si el cuadrado sigue saliendo, es que la IA generó frames más grandes.
        // Probamos con 256 que es el estándar de 4 columnas (1024/4).
        this.load.spritesheet('jugador', 'personaje.png', { 
            frameWidth: 256, 
            frameHeight: 256 
        });
    }

    create() {
        const { width, height } = this.scale;
        this.isSafe = false;
        this.isDead = false;

        // 1. FONDO (Tu imagen neón espectacular)
        let bg = this.add.image(width/2, height/2, 'fondo');
        bg.setDisplaySize(width, height);

        // 2. COORDENADAS SEGÚN TU IMAGEN
        // Ajustadas para que el personaje pise las plataformas reales del dibujo
        this.posOficina = height * 0.38; 
        this.posRefugio = height * 0.84;

        // 3. ANIMACIONES (Corregidas)
        if (this.textures.exists('jugador')) {
            this.anims.create({
                key: 'camina',
                frames: this.anims.generateFrameNumbers('jugador', { start: 0, end: 3 }),
                frameRate: 8,
                repeat: -1
            });
            this.anims.create({
                key: 'muerto',
                frames: [{ key: 'jugador', frame: 12 }],
                frameRate: 1
            });
        }

        // 4. EL PERSONAJE (Eliminamos el efecto "bloque")
        this.player = this.add.sprite(width/2, this.posOficina, 'jugador');
        
        // Forzamos que el personaje mida 120 píxeles de alto, 
        // sin importar lo grande que sea el cuadrado de la imagen original.
        this.player.setDisplaySize(120, 120); 
        this.player.setDepth(10);
        
        if (this.textures.exists('jugador')) {
            this.player.play('camina');
        }

        // 5. UI Y TEXTOS
        this.add.rectangle(0, 0, width, 60, 0x000, 0.5).setOrigin(0).setDepth(100);
        this.hpText = this.add.text(20, 15, "HP: ❤️❤️❤️", { font: 'bold 20px Arial', fill: '#00dbff' }).setDepth(101);

        // 6. CONTROL
        this.input.on('pointerdown', () => this.mover());
        this.bucleSneeze();
    }

    mover() {
        if (this.isDead) return;
        this.isSafe = !this.isSafe;
        this.tweens.add({
            targets: this.player,
            y: this.isSafe ? this.posRefugio : this.posOficina,
            duration: 400,
            ease: 'Power2'
        });
    }

    bucleSneeze() {
        if (this.isDead) return;
        this.time.delayedCall(Phaser.Math.Between(3000, 5000), () => {
            let t = this.add.text(this.scale.width/2, 200, "¡¡ACHÍS!!", { 
                font: 'bold 70px Arial', fill: '#ff0', stroke: '#000', strokeThickness: 10 
            }).setOrigin(0.5).setDepth(50);
            
            this.time.delayedCall(1200, () => {
                t.destroy();
                this.detonar();
            });
        });
    }

    detonar() {
        this.cameras.main.flash(400);
        this.cameras.main.shake(300, 0.02);
        if (!this.isSafe) {
            this.isDead = true;
            this.player.play('muerto');
            this.time.delayedCall(2000, () => location.reload());
        } else {
            this.bucleSneeze();
        }
    }
}

const config = {
    type: Phaser.AUTO,
    width: 800,
    height: 1200,
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: [OficinaScene]
};
new Phaser.Game(config);
</script>
</body>
</html>
