<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WaterWorld - Nivel 1</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
    </style>
</head>
<body>

<script>
class OficinaScene extends Phaser.Scene {
    constructor() { super({ key: 'OficinaScene' }); }

    preload() {
        // Cargamos los archivos desde tu GitHub
        this.load.image('fondo', 'fondo.png');
        this.load.spritesheet('jugador', 'personaje.png', { 
            frameWidth: 64, 
            frameHeight: 64 
        });
    }

    create() {
        const { width, height } = this.scale;
        this.isSafe = false;
        this.isDead = false;

        // --- 1. FONDO (OFICINA Y REFUGIO) ---
        if (this.textures.exists('fondo')) {
            this.add.image(width/2, height/2, 'fondo').setDisplaySize(width, height).setDepth(0);
        } else {
            // Fondo de emergencia si no hay fondo.png
            this.add.rectangle(0, 0, width, height/2, 0x141d26).setOrigin(0); // Oficina
            this.add.rectangle(0, height/2, width, height/2, 0x050505).setOrigin(0); // Refugio
            this.add.grid(width/2, height*0.75, width, height/2, 40, 40, 0x000, 0, 0x00dbff, 0.1);
        }

        // --- 2. DECORACIÓN (MESAS) ---
        // Dibujamos las mesas con líneas finas como en tu boceto
        this.desks = this.add.group();
        for(let i=0; i<3; i++) {
            let dx = (width/4) * (i+1);
            let mesa = this.add.rectangle(dx, height/3.5, 120, 8, 0x00dbff, 0.3).setStrokeStyle(2, 0x00dbff);
            let monitor = this.add.rectangle(dx, height/3.5 - 25, 40, 30, 0x1a1a1a).setStrokeStyle(1, 0x00dbff);
            this.desks.addMultiple([mesa, monitor]);
        }

        // --- 3. ANIMACIONES DEL PERSONAJE ---
        if (this.textures.exists('jugador')) {
            this.anims.create({
                key: 'camina',
                frames: this.anims.generateFrameNumbers('jugador', { start: 0, end: 3 }),
                frameRate: 8,
                repeat: -1
            });
            this.anims.create({
                key: 'susto',
                frames: [{ key: 'jugador', frame: 8 }]
            });
            this.anims.create({
                key: 'muerto',
                frames: [{ key: 'jugador', frame: 12 }]
            });
        }

        // --- 4. EL PERSONAJE ---
        // Lo colocamos centrado en la oficina
        this.player = this.add.sprite(width/2, height/4, 'jugador').setScale(2.5).setDepth(10);
        
        if (this.textures.exists('jugador')) {
            this.player.play('camina');
        } else {
            // Si falla la imagen, dibujamos un círculo para que al menos veas algo
            let circle = this.add.circle(0, 0, 20, 0x2980b9);
            this.player = this.add.container(width/2, height/4, [circle]);
        }

        // --- 5. UI (VIDA) ---
        this.hpText = this.add.text(20, 20, "HP: ❤️❤️❤️", { font: 'bold 20px Arial', fill: '#00dbff' }).setDepth(100);

        // --- 6. MECÁNICA ---
        this.input.on('pointerdown', () => this.irAlRefugio());
        this.esperarEstornudo();
    }

    irAlRefugio() {
        if (this.isDead) return;
        this.isSafe = !this.isSafe;
        let destinoY = this.isSafe ? (this.scale.height * 0.75) : (this.scale.height * 0.25);
        
        this.tweens.add({
            targets: this.player,
            y: destinoY,
            duration: 400,
            ease: 'Power2'
        });
    }

    esperarEstornudo() {
        if (this.isDead) return;
        this.time.delayedCall(Phaser.Math.Between(3000, 5000), () => {
            if (this.player.play) this.player.play('susto');
            let aviso = this.add.text(this.scale.width/2, 120, "¡¡ACHÍS!! 🤧", { 
                font: 'bold 60px Arial', fill: '#ffff00', stroke: '#000', strokeThickness: 6 
            }).setOrigin(0.5);
            
            this.time.delayedCall(1200, () => {
                aviso.destroy();
                this.explosionNuclear();
            });
        });
    }

    explosionNuclear() {
        this.cameras.main.flash(500);
        this.cameras.main.shake(400, 0.02);

        if (!this.isSafe) {
            this.isDead = true;
            if (this.player.play) this.player.play('muerto');
            this.time.delayedCall(2000, () => location.reload());
        } else {
            if (this.player.play) this.player.play('camina');
            this.esperarEstornudo();
        }
    }
}

const config = {
    type: Phaser.AUTO,
    width: 800,
    height: 1200,
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: [OficinaScene]
};
new Phaser.Game(config);
</script>
</body>
</html>
