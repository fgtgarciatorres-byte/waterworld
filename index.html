<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WaterWorld - Edición Neón</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; }
        #ui-inicio {
            position: absolute; width: 100%; height: 100%;
            background: radial-gradient(circle, #0a1422 0%, #000 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 2000; color: white;
        }
        .logo { font-size: 3rem; color: #ff00ff; text-shadow: 0 0 15px #ff00ff; margin-bottom: 20px; font-weight: bold; }
        .btn-container { display: flex; gap: 20px; }
        .btn-neon {
            padding: 15px 25px; font-size: 18px; color: #0ff; border: 2px solid #0ff;
            background: transparent; cursor: pointer; text-shadow: 0 0 5px #0ff;
            box-shadow: 0 0 10px #0ff; border-radius: 10px; transition: 0.3s;
        }
        .btn-neon:hover { background: #0ff; color: #000; }
    </style>
</head>
<body>

    <div id="ui-inicio">
        <div class="logo">WATERWORLD</div>
        <p>SELECCIONA TU I.D. OPERATIVO</p>
        <div class="btn-container">
            <button class="btn-neon" onclick="iniciar('hombre')">HOMBRE</button>
            <button class="btn-neon" onclick="iniciar('mujer')" style="color:#f0f; border-color:#f0f; box-shadow:0 0 10px #f0f;">MUJER</button>
        </div>
    </div>

    <div id="game-container"></div>

<script>
let seleccion = 'hombre';

function iniciar(genero) {
    seleccion = genero;
    document.getElementById('ui-inicio').style.display = 'none';
    lanzarJuego();
}

function lanzarJuego() {
    const config = {
        type: Phaser.AUTO,
        width: 800,
        height: 1200,
        parent: 'game-container',
        scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
        physics: { default: 'arcade' },
        scene: { preload: preload, create: create, update: update }
    };
    new Phaser.Game(config);
}

function preload() {
    // IMPORTANTE: Extensiones corregidas a .jpg como tus archivos reales
    this.load.image('fondo', 'fondo.jpg'); 
    this.load.image('spritesheet', 'personaje.jpg');
}

function create() {
    const { width, height } = this.scale;

    // 1. FONDO
    this.add.image(width/2, height/2, 'fondo').setDisplaySize(width, height);

    // 2. JUGADOR (Recorte manual para evitar errores de spritesheet)
    this.player = this.add.sprite(width/2, height * 0.45, 'spritesheet');
    
    // Si eliges mujer, recortamos la segunda fila de tu imagen personaje.jpg
    if (seleccion === 'mujer') {
        this.player.setCrop(0, 143, 250, 143); 
    } else {
        this.player.setCrop(0, 0, 250, 143); // Fila del hombre
    }
    this.player.setScale(1.5);

    // 3. ANIMACIÓN DE LATIDO (Tween procedural)
    this.tweens.add({
        targets: this.player,
        scaleX: 1.7,
        scaleY: 1.3,
        duration: 900,
        yoyo: true,
        repeat: -1,
        ease: 'Sine.easeInOut'
    });

    // 4. LÓGICA DE MOVIMIENTO
    this.isSafe = false;
    this.posOficina = height * 0.45;
    this.posBunker = height * 0.85;

    this.input.on('pointerdown', () => {
        this.isSafe = !this.isSafe;
        this.tweens.add({
            targets: this.player,
            y: this.isSafe ? this.posBunker : this.posOficina,
            duration: 500,
            ease: 'Power2'
        });
    });

    // 5. CICLO DE ALERTA (Achís)
    this.alertaTexto = this.add.text(width/2, 300, "", { fontSize: '80px', fill: '#ff0', fontStyle: 'bold' }).setOrigin(0.5);
    
    this.time.addEvent({
        delay: 5000,
        callback: () => {
            this.alertaTexto.setText("¡ACHÍS! 🤧");
            this.cameras.main.shake(500, 0.01);
            
            this.time.delayedCall(1500, () => {
                this.alertaTexto.setText("");
                if (!this.isSafe) {
                    this.cameras.main.flash(500, 255, 0, 0);
                    this.player.setTint(0xff0000);
                    alert("SISTEMA COLAPSADO: No llegaste al refugio.");
                    location.reload();
                }
            });
        },
        loop: true
    });
}

function update() {}
</script>
</body>
</html>
