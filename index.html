<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>WaterWorld - Nivel 1 Finalizado</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Courier New', monospace; }
        #ui-inicio {
            position: absolute; width: 100%; height: 100%;
            background: #001; display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 2000; color: #0ff; text-align: center;
        }
        .input-id { background: #000; border: 2px solid #0ff; color: #0ff; padding: 10px; margin: 10px; font-size: 20px; text-align: center; box-shadow: 0 0 10px #0ff; }
        .btn { padding: 15px 30px; margin: 10px; cursor: pointer; background: transparent; border: 2px solid #f0f; color: #f0f; box-shadow: 0 0 10px #f0f; font-weight: bold; border-radius: 5px; }
    </style>
</head>
<body>

    <div id="ui-inicio">
        <h1 style="font-size: 45px; text-shadow: 0 0 15px #0ff;">WATERWORLD</h1>
        <input type="text" id="player-name" class="input-id" placeholder="I.D. EMPLEADO" maxlength="10">
        <div>
            <button class="btn" onclick="comenzar('h')">♂ HOMBRE</button>
            <button class="btn" onclick="comenzar('m')" style="border-color:#0ff; color:#0ff; box-shadow: 0 0 10px #0ff;">♀ MUJER</button>
        </div>
    </div>

<script>
let genero = 'h';
let miNombre = "OPERADOR";

function comenzar(g) {
    genero = g;
    let n = document.getElementById('player-name').value;
    if(n) miNombre = n.toUpperCase();
    document.getElementById('ui-inicio').style.display = 'none';
    
    const config = {
        type: Phaser.AUTO,
        width: 800,
        height: 1200,
        parent: 'game-container',
        scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
        physics: { default: 'arcade' },
        scene: { preload: preload, create: create }
    };
    new Phaser.Game(config);
}

function preload() {
    this.load.image('fondo', 'fondo.png');
    this.load.image('bunker', 'WhatsApp Image 2026-04-16 at 09.54.47.jpeg');
    this.load.image('explosion', 'explosion.png');
    
    // Carga de Sprites Individuales (Nombres corregidos)
    this.load.image('h_n', 'personajeh.png');   this.load.image('h_a', 'personajeha.png');  this.load.image('h_m', 'personajehm.png');
    this.load.image('m_n', 'personajem.png');   this.load.image('m_a', 'personajema.png');  this.load.image('m_m', 'personajemm.png');
}

function create() {
    const { width, height } = this.scale;

    // 1. FONDO Y ESCENARIO
    this.add.image(width/2, height/2, 'fondo').setDisplaySize(width, height).setDepth(-1);
    this.add.image(width/2, 1100, 'bunker').setScale(0.6).setAlpha(0.6);

    // 2. CONTENEDOR PERSONAJE (Une Nombre + Sprite)
    this.pContainer = this.add.container(width/2, 400); // Inicia en la oficina (Arriba)
    let key = genero === 'h' ? 'h_n' : 'm_n';
    this.sprite = this.add.sprite(0, 0, key).setScale(0.5);
    this.txtNombre = this.add.text(0, -130, miNombre, { fontSize: '26px', fill: '#0ff', fontStyle: 'bold', stroke: '#000', strokeThickness: 4 }).setOrigin(0.5);
    
    this.pContainer.add([this.sprite, this.txtNombre]);

    // Latido (Afecta a todo el contenedor: nombre y personaje juntos)
    this.tweens.add({ targets: this.pContainer, scale: 1.05, duration: 800, yoyo: true, repeat: -1 });

    // 3. UI: VIDAS Y RELOJ (ROJO)
    this.vidas = 3;
    this.corazones = this.add.text(30, 40, '❤️❤️❤️', { fontSize: '45px' });
    
    this.horas = 8; this.minutos = 0;
    this.reloj = this.add.text(width - 260, 40, '08:00 AM', { 
        fontSize: '48px', fill: '#ff0000', fontStyle: 'bold', stroke: '#000', strokeThickness: 6 
    });

    // Reloj acelerado (Límite 15:00 PM)
    this.time.addEvent({
        delay: 1000,
        callback: () => {
            if(this.vidas <= 0) return;
            this.minutos += 30;
            if(this.minutos >= 60) { this.minutos = 0; this.horas++; }
            let h = this.horas < 10 ? '0'+this.horas : this.horas;
            let m = this.minutos === 0 ? '00' : this.minutos;
            this.reloj.setText(`${h}:${m} PM`);
            if(this.horas >= 15) this.morir("JORNADA FINALIZADA");
        },
        loop: true
    });

    // 4. MOVIMIENTO (Click) - Suelo en 1080
    this.isSafe = false;
    this.input.on('pointerdown', () => {
        if(this.vidas <= 0) return;
        this.isSafe = !this.isSafe;
        let posFinal = this.isSafe ? 1080 : 400;
        this.tweens.add({ targets: this.pContainer, y: posFinal, duration: 500, ease: 'Power2' });
    });

    // 5. CICLO ACHÍS
    this.time.addEvent({
        delay: 6000,
        loop: true,
        callback: () => {
            if(this.vidas <= 0 || this.horas >= 15) return;
            
            // Alerta
            this.sprite.setTexture(genero === 'h' ? 'h_a' : 'm_a');
            this.cameras.main.shake(400, 0.01);
            
            this.time.delayedCall(2000, () => {
                if (this.pContainer.y < 600) { // Si está en la zona de arriba
                    this.quitarVida();
                } else {
                    this.sprite.setTexture(genero === 'h' ? 'h_n' : 'm_n'); // Vuelve a normal
                }
            });
        }
    });
}

function quitarVida() {
    this.vidas--;
    let hearts = '';
    for(let i=0; i<this.vidas; i++) hearts += '❤️';
    this.corazones.setText(hearts);

    if (this.vidas <= 0) {
        this.morir("SISTEMA DESTRUIDO");
    } else {
        this.cameras.main.flash(500, 255, 0, 0);
        this.sprite.setTexture(genero === 'h' ? 'h_n' : 'm_n');
    }
}

function morir(motivo) {
    if(this.muertoYa) return;
    this.muertoYa = true;
    
    // 1. Imagen de muerte (HM o MM)
    this.sprite.setTexture(genero === 'h' ? 'h_m' : 'm_m');

    // 2. Efecto Explosión
    let exp = this.add.image(this.pContainer.x, this.pContainer.y, 'explosion').setScale(0.1).setDepth(100);
    this.tweens.add({ targets: exp, scale: 4, duration: 800, ease: 'Expo.out' });
    this.cameras.main.shake(1000, 0.05);

    this.time.delayedCall(2500, () => {
        alert("GAME OVER: " + motivo);
        location.reload();
    });
}
</script>
</body>
</html>
